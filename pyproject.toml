[project]
name = "openaustralia-mcp"
version = "0.1.0"
description = "MCP server for the federal Australian Parliament: members, electorates, Hansard and votes"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Jeremiah Wangaruro", email = "jeremiah.ruro@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anyio>=4.15.1",
    "httpx2>=2.16.0",
    "mcp>=2.3.0",
    "pydantic>=2.14.1",
]

[project.scripts]
openaustralia-mcp = "openaustralia_mcp:main"

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
