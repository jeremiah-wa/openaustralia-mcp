# The repository's labels. When this file changes on main, the Labels workflow (workflows/labels.yml) makes GitHub's
# labels match it: it creates and updates labels, and deletes any that aren't here. A pull request that changes the
# file shows what will change. The workflow won't delete a label that's still on an issue or a pull request.
#
# To rename a label, change its name and list the old one, so its issues keep it:
#
#   - name: feature
#     renamed_from: [enhancement]
#
# Once the rename is on main, renamed_from can go.

# What kind of work it is, one per issue. Each matches a commit type in contributing.md, except research, whose
# result is a decision rather than code.
- name: bug
  color: d73a4a
  description: Something isn't working
- name: feature
  renamed_from: [enhancement]
  color: a2eeef
  description: A new tool, or a change in behaviour users can see
- name: refactor
  color: c5def5
  description: Code changes with no change in behaviour
- name: documentation
  color: 0075ca
  description: Improvements or additions to documentation
- name: chore
  color: fef2c0
  description: Tooling, CI, packaging and the eval harness
- name: research
  color: 5319e7
  description: An experiment, measurement, design or investigation whose result is a decision

# How soon. At most one per issue.
- name: "priority: high"
  color: b60205
  description: Do next, or it blocks the next stage of the roadmap
- name: "priority: medium"
  color: d93f0b
  description: Planned, after the high-priority work
- name: "priority: low"
  color: c2e0c6
  description: Do when next working in that area

# Triage.
- name: duplicate
  color: cfd3d7
  description: This issue or pull request already exists
- name: good first issue
  color: 7057ff
  description: Good for newcomers
- name: help wanted
  color: "008672"
  description: Extra attention is needed
- name: invalid
  color: e4e669
  description: This doesn't seem right
- name: question
  color: d876e3
  description: Further information is requested
- name: wontfix
  color: ffffff
  description: This will not be worked on

# evals.yml runs the evals when a pull request gets this label, so it mustn't be renamed.
- name: run-evals
  color: FBCA04
  description: Run the tool-use evals in CI (costs about $2.40 a run)
