name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked
      - run: uv run ruff format --check
      - run: uv run ruff check
      # No API keys are set here, so the live smoke tests skip. The TestKeyNeverLeaks classes run against a sentinel key.
      - run: uv run pytest

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # the action lists a pull request's commits to know which to scan
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the action scans a range of commits, so it needs the history
      # Scans the commits a pull request or a push to main adds, with .gitleaks.toml: gitleaks' default rules plus one
      # for OpenAustralia and They Vote For You keys.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The pre-commit hook's version, in .pre-commit-config.yaml. The action's default is older.
          GITLEAKS_VERSION: 8.28.0
          # Comments would need pull-requests: write. A finding is in the job summary and the log.
          GITLEAKS_ENABLE_COMMENTS: "false"
