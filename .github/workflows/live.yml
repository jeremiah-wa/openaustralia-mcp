name: Live API

# Smoke tests against the real OpenAustralia API, with the key from the repository secret. They run weekly, by hand,
# and on pull requests that change them. Not on every push: OpenAustralia is a free service run by a charity.
on:
  schedule:
    - cron: "17 20 * * 0" # Sunday 20:17 UTC, early Monday morning in Australia
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/live.yml
      - tests/test_live.py

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    env:
      OPENAUSTRALIA_API_KEY: ${{ secrets.OPENAUSTRALIA_API_KEY }}
    steps:
      # Without a key the live tests skip, and the job would pass without testing anything. Pull requests from forks
      # get no secrets, so they stop here too.
      - name: Check the key is set
        run: |
          if [ -z "$OPENAUSTRALIA_API_KEY" ]; then
            echo "::error::The OPENAUSTRALIA_API_KEY repository secret isn't set."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked
      - run: uv run pytest tests/test_live.py -rs
