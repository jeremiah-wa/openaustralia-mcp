id: members-by-name
# Case 17 from #6. Graded on the answer, so it's the same for every variant of the tools (#8): the member's url
# shows the answer came from a lookup, not from memory. A lookup that doesn't say the house asks both.
tags: [capability, members]
question: Which electorate does Peter Khalil represent?
fixtures:
  - file: getRepresentatives_search_Khalil.json
    part_of: {search: [Peter Khalil]}
  - file: getSenators_search_Khalil.json
    part_of: {search: [Peter Khalil]}
expect:
  answer_contains: [Wills, "https://www.openaustralia.org.au/mp/?p=10887"]
  cites_url: true
