id: members-former-from-hansard
# Keith Wolahan was the MP for Menzies from 2022 to 2025. Name searches find current members only, so the way to him
# is his person_id on a Ruby Princess hit in Hansard, then a lookup by person_id. His member page in the answer
# shows that lookup happened.
tags: [capability, members, search]
question: >-
  Keith Wolahan spoke about the Ruby Princess in Parliament. Which electorate did that member represent,
  and are they still in Parliament?
fixtures:
  - file: getRepresentatives_search_Wolahan.json
    part_of: {search: [Keith Wolahan]}
  - file: getSenators_search_Wolahan.json
    part_of: {search: [Keith Wolahan]}
  - file: getHansard_search_ruby_princess.json
    search_contains: [Ruby Princess]
  - getRepresentative_id_10990.json
  - getSenator_id_10990.json
expect:
  answer_contains: [Menzies, "https://www.openaustralia.org.au/mp/?p=10990"]
  cites_url: true
