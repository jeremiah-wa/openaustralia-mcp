# Local hooks. Install once per clone with `uv run pre-commit install`.
# gitleaks reads .gitleaks.toml, the same rule CI's secrets job uses, and checks only what's staged.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: 4fb43823ef3d152d239e92d7d5cb04783b548062 # frozen: v8.28.0
    hooks:
      - id: gitleaks
